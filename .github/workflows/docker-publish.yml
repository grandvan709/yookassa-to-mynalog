name: Docker Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'test-[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: grandvan/yookassa-to-mynalog

      - name: Compute Docker tags
        id: tags
        run: |
          IMAGE="grandvan/yookassa-to-mynalog"
          REF="${{ github.ref_name }}"
          if [[ "$REF" == test-* ]]; then
            echo "Computed tags for test build: $IMAGE:$REF"
            echo "list=$IMAGE:$REF" >> "$GITHUB_OUTPUT"
          else
            echo "Computed tags for release: $IMAGE:$REF, $IMAGE:latest"
            echo "list=$IMAGE:$REF,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
