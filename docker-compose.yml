services:
  yookassa-to-mynalog:
    container_name: yookassa-to-mynalog
    hostname: yookassa-to-mynalog
    image: grandvan/yookassa-to-mynalog:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    dns:
      - 77.88.8.8
      - 77.88.8.1
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./logs
        target: /app/logs
    environment:
      PYTHONUNBUFFERED: "1"
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
    healthcheck:
      test: ["CMD", "runuser", "-u", "app", "--", "python", "/app/healthcheck.py"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 5m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
