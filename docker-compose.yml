services:
  yookassa-to-mynalog:
    container_name: yookassa-to-mynalog
    hostname: yookassa-to-mynalog
    build:
      context: .
      dockerfile: Dockerfile
      # На серверах с заблокированным Docker bridge сборочные RUN-команды
      # используют сеть хоста. На обычной установке Linux это также работает.
      network: ${DOCKER_BUILD_NETWORK:-host}
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    # Если уже запущенный контейнер тоже не выходит в интернет через bridge,
    # задайте DOCKER_NETWORK_MODE=host в .env.
    network_mode: ${DOCKER_NETWORK_MODE:-bridge}
    init: true
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./logs
        target: /app/logs
    environment:
      PYTHONUNBUFFERED: "1"
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
    healthcheck:
      test: ["CMD", "runuser", "-u", "app", "--", "python", "/app/healthcheck.py"]
      interval: 1m
      timeout: 15s
      retries: 3
      start_period: 5m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
